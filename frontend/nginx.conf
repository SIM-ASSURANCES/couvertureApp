server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/geo+json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Proxy API → backend. Résolution DNS dynamique (résolveur Docker embarqué,
    # 127.0.0.11) via une variable dans proxy_pass : sans ça, nginx résout
    # "backend" une seule fois au démarrage du worker et garde l'IP en cache
    # indéfiniment, ce qui casse le proxy dès que le conteneur backend est
    # recréé (nouvelle IP interne) sans redémarrage du frontend.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Fichiers statiques à la racine SANS hash dans leur nom (logos, icônes,
    # cachets) : jusqu'ici servis avec `no-store` comme index.html, donc
    # re-téléchargés à chaque visite ET à chaque génération de PDF (le serveur
    # d'API les charge via ce même nginx). 1 jour + revalidation en arrière-plan
    # d'une semaine : un fichier remplacé est visible sous 24 h au plus.
    location ~* ^/(?:[^/]+\.(?:png|jpe?g|webp|svg|ico)|icons/.+)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # Annuaire du réseau de soins (142 Ko, change rarement).
    location = /reseau-soins.json {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    # Cache long pour les assets buildés (hash dans le nom)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Carte interactive : export statique Next.js (frontend/carte, basePath
    # /carte). Les pages sont des fichiers .html (/carte/ville/abidjan →
    # ville/abidjan.html), jamais mis en cache ; les assets _next/static sont
    # hashés, les GeoJSON changent rarement.
    location = /carte {
        try_files /carte/index.html =404;
    }
    location /carte/ {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /carte/404.html;
        add_header Cache-Control "no-cache";
    }
    location /carte/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /carte/api/ {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }
    location /carte/data/ {
        types { application/geo+json geojson; }
        default_type application/json;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # SPA — renvoie toujours index.html pour les routes React Router.
    # index.html ne doit JAMAIS être mis en cache, sinon les nouveaux
    # déploiements ne sont pas pris en compte (l'ancien bundle reste chargé).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }
}
